name: Generate Testcases for New Skills

# Maintainer-triggered: run this after reviewing a PR that adds skills. It reads the PR's
# SKILL.md files as data (never executes PR code) and, unless dry-run, opens a PR in the
# private testcases repo for a human to review.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Number of the rse-plugins PR that adds the new skill(s)
        required: true
        type: string
      dry-run:
        description: Upload the generated testcases as an artifact instead of opening a testcases PR
        required: false
        type: boolean
        default: true
      model:
        description: LiteLLM model that drafts the testcases
        required: false
        type: string
        default: claude-sonnet-4-6

permissions: {}

env:
  TESTCASES_REPO: ${{ github.repository_owner }}/rse-plugins-testcases

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr-number must be digits only"
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find added SKILL.md files
        id: find-skills
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha' > "$RUNNER_TEMP/head-sha.txt"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title' > "$RUNNER_TEMP/pr-title.txt"
          added=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status == "added") | select(.filename | test("^(plugins|community-plugins)/[^/]+/skills/[^/]+/SKILL\\.md$")) | .filename' \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')

          count=$(jq length <<< "$added")
          {
            echo "head-sha=$(cat "$RUNNER_TEMP/head-sha.txt")"
            echo "skills=$added"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            echo "No new SKILL.md files found in this PR (modification only)"
          else
            echo "Found $count new skill(s):"
            jq -r '.[]' <<< "$added"
          fi

      - name: Checkout PR branch
        if: steps.find-skills.outputs.count > 0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.find-skills.outputs.head-sha }}
          path: pr-content
          persist-credentials: false

      - name: Setup Python
        if: steps.find-skills.outputs.count > 0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.find-skills.outputs.count > 0
        run: python -m pip install 'openai==3.31.0' 'pyyaml==6.0.3'

      - name: Generate testcases
        if: steps.find-skills.outputs.count > 0
        env:
          SKILLS: ${{ steps.find-skills.outputs.skills }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
          GENERATION_MODEL: ${{ inputs.model }}
        run: |
          python .github/scripts/generate-testcases.py \
            --skills "$SKILLS" \
            --skill-root pr-content \
            --output-dir "$RUNNER_TEMP/generated-testcases" \
            --warnings-file "$RUNNER_TEMP/validation-warnings.txt" \
            --model "$GENERATION_MODEL"

      # !cancelled(): keep the drafts that did generate when another skill failed.
      - name: Upload generated testcases (dry run)
        if: ${{ !cancelled() && steps.find-skills.outputs.count > 0 && inputs.dry-run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-testcases-pr-${{ inputs.pr-number }}
          path: |
            ${{ runner.temp }}/generated-testcases/
            ${{ runner.temp }}/validation-warnings.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout testcases repo
        if: steps.find-skills.outputs.count > 0 && !inputs.dry-run
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.TESTCASES_REPO }}
          # TEST_REPO_TOKEN: fine-grained PAT with Contents: Read/Write and Pull requests: Read/Write
          token: ${{ secrets.TEST_REPO_TOKEN }}
          path: testcases-repo
          persist-credentials: true # zizmor: ignore[artipacked] the next step pushes; this checkout is never uploaded

      - name: Push branch and open PR in testcases repo
        if: steps.find-skills.outputs.count > 0 && !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="auto/testcases-pr-${PR_NUMBER}"
          PR_TITLE=$(cat "$RUNNER_TEMP/pr-title.txt")
          PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
          WARNINGS_FILE="$RUNNER_TEMP/validation-warnings.txt"

          cd testcases-repo
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists in $TESTCASES_REPO. Merge or delete its PR, then re-run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cp -R "$RUNNER_TEMP/generated-testcases/." .

          git add .
          if git diff --cached --quiet; then
            echo "No testcase files were generated; skipping PR creation"
            exit 0
          fi

          git commit -m "feat: add generated testcases for ${REPO}#${PR_NUMBER}"
          git push origin "$BRANCH"

          {
            printf 'Automatically generated testcases for %s.\n\nReview and adjust the generated cases before merging.\n' "$PR_URL"
            if [ -s "$WARNINGS_FILE" ]; then
              printf '\n**Validation warnings** (these files may need manual fixes):\n\n'
              sed 's/^/- /' "$WARNINGS_FILE"
            fi
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --repo "$TESTCASES_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "testcases: ${PR_TITLE}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
